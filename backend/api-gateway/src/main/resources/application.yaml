
server:
  port: 8080


app:
  api-prefix: /api

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:
            # 1. AUTH SERVICE
            - id: auth-service-public
              uri: http://localhost:8081
              predicates:
                - Path=${app.api-prefix}/auth/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: auth-service-admin
              uri: http://localhost:8081
              predicates:
                - Path=${app.api-prefix}/admin/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            # 2. USER / PROFILE SERVICE
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=${app.api-prefix}/profile/users/**
              filters:
                - StripPrefix=1

            # 3. COURSE SERVICE
            - id: course-categories-service
              uri: http://localhost:8083
              predicates:
                - Path=${app.api-prefix}/categories/**
              filters:
                - StripPrefix=1

            - id: course-main-service
              uri: http://localhost:8083
              predicates:
                - Path=${app.api-prefix}/courses/**
              filters:
                - StripPrefix=1

            - id: lesson-service
              uri: http://localhost:8083
              predicates:
                - Path=${app.api-prefix}/lessons/**
              filters:
                - StripPrefix=1

            # 4. EXERCISE SERVICE
            - id: exercise-service
              uri: http://localhost:8084
              predicates:
                - Path=${app.api-prefix}/exercises/**
              filters:
                - StripPrefix=1

            # 5. ENROLLMENT / PROGRESS SERVICE
            - id: enrollment-service
              uri: http://localhost:8085
              predicates:
                - Path=${app.api-prefix}/enrollments/**
              filters:
                - StripPrefix=1

            - id: enrollment-progress-service
              uri: http://localhost:8085
              predicates:
                - Path=${app.api-prefix}/progress/**
              filters:
                - StripPrefix=1

            # 6. SUBMISSION SERVICE
            - id: submission-service
              uri: http://localhost:8086
              predicates:
                - Path=${app.api-prefix}/submissions/**
              filters:
                - StripPrefix=1

            # 7. CODE EXECUTION SERVICE
            - id: code-execution-service
              uri: http://localhost:8087
              predicates:
                - Path=${app.api-prefix}/code/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: execution-service
              uri: http://localhost:8087
              predicates:
                - Path=${app.api-prefix}/executions/**
              filters:
                - StripPrefix=1

            # 8. AI TUTOR SERVICE
            - id: ai-tutor-service
              uri: http://localhost:8000
              predicates:
                - Path=${app.api-prefix}/ai-tutor/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 4
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"
